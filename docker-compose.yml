name: zbits-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: zbits-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zbits}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zbits_secret}
      POSTGRES_DB: ${POSTGRES_DB:-zbits}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zbits} -d ${POSTGRES_DB:-zbits}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

